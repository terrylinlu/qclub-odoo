name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: make lint
      - run: make up
      - run: make test
      - run: make report
        if: always()
        # 阶段 1 完成后，把这里改成: STRICT=1 make report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: docs/reports/
