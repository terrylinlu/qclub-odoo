name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: make lint
      - run: make up
      - run: make test
      - run: make iso-check
      - run: make report
        if: always()
        # 阶段 1 完成后，把这里改成: STRICT=1 make report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: docs/reports/
  # Browser tests. Deliberately not a required check on main: a failure here is
  # reported but does not block merging. Re-evaluate once it has been stable.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: make demo
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e/test-results/
          if-no-files-found: ignore
