# 仅用于开发/测试，与生产环境完全隔离。数据库不对外暴露端口。
name: qclub-test

services:
  db:
    image: postgres:16            # 官方镜像自带 contrib，包含 btree_gist
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_test   # 仅测试用，不是任何真实环境的密码
      POSTGRES_DB: postgres
    # 测试环境关闭强制落盘，加快速度（不要用于生产）
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  odoo: &odoo
    image: odoo:19.0@sha256:5e755c725b3c43cf0be16d579904e1418300db3a2c44952f928eaddbcb0cc16d  # 固定摘要（2026-11-04）；升级时重新获取摘要并单独提 PR
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_test
      TZ: UTC
    volumes:
      - ../addons:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo   # 文件存储按库名分目录，测试库与演示库互不干扰
    ports:
      - "127.0.0.1:8070:8069"     # 仅本机可访问，供端到端测试使用（8069 留给演示环境）
    # 默认命令用于 `docker compose up odoo`（端到端测试）；make 的各命令会用 run 覆盖
    command: ["odoo", "-d", "qclub_test", "--no-database-list", "--without-demo=True"]

  # 演示环境（make demo）：与 odoo 服务同镜像、同配置，只看得到演示库 qclub_demo
  demo:
    <<: *odoo
    ports:
      - "127.0.0.1:8069:8069"     # 仅本机可访问；浏览器用 localhost / qclub.localhost / aushare.localhost
    command: ["odoo", "-d", "qclub_demo", "--db-filter=^qclub_demo$$", "--no-database-list", "--without-demo=True"]

volumes:
  pgdata:
  odoo-data:
